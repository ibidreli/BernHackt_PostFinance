services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      CSV_PATH: /data/data_personal.csv
    env_file:
      # OPENAI_API_KEY, ASSISTANT_MODE etc. (Feature #5). Injected at
      # container runtime, not copied into the image - see
      # apps/api/.dockerignore.
      - ./apps/api/app/.env
    volumes:
      # Bind-mounted (not baked into the image) so the CSV can be swapped
      # for the real dataset without rebuilding the container.
      - ./data:/data:ro
      # Live-reload for local development.
      - ./apps/api/app:/app/app
      # So `docker compose exec api python -m pytest tests` runs the
      # current suite without a rebuild or docker cp.
      - ./apps/api/tests:/app/tests
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
