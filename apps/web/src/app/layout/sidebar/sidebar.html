<aside
  id="app-sidebar"
  class="flex h-full shrink-0 flex-col overflow-hidden rounded-xl text-foreground transition-[width] duration-150"
  [class.w-64]="!collapsed()"
  [class.w-[72px]]="collapsed()"
>
  <div class="flex items-center gap-2 px-4 py-4" [class.justify-center]="collapsed()">
    <span
      aria-hidden="true"
      class="grid size-8 shrink-0 place-items-center rounded-lg bg-primary font-bold text-pf-teal"
    >
      P
    </span>
    @if (!collapsed()) {
      <div class="leading-tight whitespace-nowrap">
        <p class="text-sm font-semibold">PostFinance</p>
        <p class="text-xs text-muted-foreground">Horizons</p>
      </div>
    }
  </div>

  <nav aria-label="Main" class="flex-1 overflow-y-auto px-3 py-2">
    @for (group of groups; track group.label) {
      <div class="mb-4">
        <p
          class="px-2 pb-1 text-xs font-medium uppercase tracking-wide text-muted-foreground"
          [class.sr-only]="collapsed()"
        >
          {{ group.label }}
        </p>
        <ul class="flex flex-col gap-0.5" [attr.aria-label]="group.label">
          @for (item of group.items; track item.route) {
            <li [class.flex]="collapsed()" [class.justify-center]="collapsed()">
              <a
                [routerLink]="item.route"
                routerLinkActive
                #link="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: true }"
                [attr.aria-current]="link.isActive ? 'page' : null"
                [attr.aria-label]="collapsed() ? item.label : null"
                [attr.title]="collapsed() ? item.label : null"
                class="flex items-center gap-2 rounded-lg px-2 py-2 text-sm hover:bg-surface hover:text-foreground"
                [class.justify-center]="collapsed()"
                [class.w-full]="!collapsed()"
                [class.size-9]="collapsed()"
                [class.bg-surface]="link.isActive"
                [class.text-foreground]="link.isActive"
                [class.text-muted-foreground]="!link.isActive"
              >
                <svg lucideLayoutGrid aria-hidden="true" class="size-4 shrink-0"></svg>

                @if (!collapsed()) {
                  {{ item.label }}
                }
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <div class="border-t border-border px-3 py-3">
    <button
      type="button"
      [attr.aria-label]="collapsed() ? 'Sign out' : null"
      [attr.title]="collapsed() ? 'Sign out' : null"
      class="flex w-full items-center gap-2 rounded-lg px-2 py-1.5 text-muted-foreground hover:bg-surface hover:text-foreground"
      [class.justify-center]="collapsed()"
    >
      <svg lucideLogOut aria-hidden="true" class="size-4 shrink-0"></svg>
      @if (!collapsed()) {
        <span class="truncate text-sm">Sign out</span>
      }
    </button>
  </div>
</aside>
