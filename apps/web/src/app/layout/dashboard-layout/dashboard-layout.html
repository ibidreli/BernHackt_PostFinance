<div class="flex h-screen gap-2 bg-shell p-2">
  <app-sidebar [collapsed]="collapsed()" />

  <div
    class="flex flex-1 flex-col overflow-hidden rounded-xl border border-border bg-background shadow-sm"
  >
    <header class="flex items-center justify-between border-b border-border px-4 py-3">
      <div class="flex items-center gap-3">
        <button
          type="button"
          (click)="toggleCollapsed()"
          aria-label="Toggle sidebar"
          aria-controls="app-sidebar"
          [attr.aria-expanded]="!collapsed()"
          class="grid size-8 place-items-center rounded-lg text-muted-foreground hover:bg-surface hover:text-foreground"
        >
          <svg lucidePanelLeft aria-hidden="true" class="size-4"></svg>
        </button>

        <div class="h-4 w-px bg-border"></div>

        <nav aria-label="Breadcrumb">
          <ol class="flex items-center gap-1.5 text-sm">
            <li class="text-muted-foreground">PostFinance</li>
            <li aria-hidden="true" class="flex items-center">
              <svg lucideChevronRight class="size-3.5 text-muted-foreground"></svg>
            </li>
            <li aria-current="page" class="font-medium text-foreground">{{ pageTitle() }}</li>
          </ol>
        </nav>
      </div>

      <button
        type="button"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        class="grid size-8 place-items-center rounded-full border border-border text-foreground hover:bg-surface"
      >
        @if (theme.isDark()) {
          <svg lucideMoon aria-hidden="true" class="size-4"></svg>
        } @else {
          <svg lucideSun aria-hidden="true" class="size-4"></svg>
        }
      </button>
    </header>

    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>

  <!-- Right rail, mirroring the sidebar: sits on the shell background
       outside the card, so the card itself stays uncluttered. -->
  @if (rail.template(); as railTemplate) {
    <div class="hidden w-80 shrink-0 flex-col overflow-y-auto py-2 lg:flex">
      <ng-container [ngTemplateOutlet]="railTemplate" />
    </div>

    <!-- Below lg the rail becomes a bottom sheet - without this, the
         page controls simply don't exist on mobile. Conditionally
         rendered (not CSS-hidden), so the sheet's copy of the template
         only enters the DOM while it is actually open. -->
    <button
      type="button"
      class="fixed bottom-4 right-4 z-30 grid size-12 place-items-center rounded-full bg-foreground text-background shadow-lg lg:hidden"
      aria-label="Optionen anzeigen"
      aria-haspopup="dialog"
      [attr.aria-expanded]="railOpen()"
      (click)="railOpen.set(true)"
    >
      <svg lucideSettings2 aria-hidden="true" class="size-5"></svg>
    </button>

    @if (railOpen()) {
      <div class="fixed inset-0 z-40 lg:hidden" (keydown.escape)="railOpen.set(false)">
        <button
          type="button"
          class="absolute inset-0 cursor-default bg-foreground/30"
          aria-label="Optionen schliessen"
          (click)="railOpen.set(false)"
        ></button>
        <div
          class="animate-rise-in absolute inset-x-0 bottom-0 max-h-[70dvh] overflow-y-auto rounded-t-xl border-t border-border bg-background p-4 pb-6 shadow-lg"
          role="dialog"
          aria-modal="true"
          aria-label="Optionen"
        >
          <div class="flex items-center justify-between pb-2">
            <p class="text-xs font-medium uppercase tracking-wide text-muted-foreground">Optionen</p>
            <button
              type="button"
              class="grid size-8 place-items-center rounded-full text-muted-foreground hover:bg-surface"
              aria-label="Schliessen"
              #sheetClose
              (click)="railOpen.set(false)"
            >
              ×
            </button>
          </div>
          <ng-container [ngTemplateOutlet]="railTemplate" />
        </div>
      </div>
    }
  }
</div>
