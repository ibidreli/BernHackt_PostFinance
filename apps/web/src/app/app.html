<header class="flex items-center justify-between border-b border-[var(--color-border)] px-6 py-4">
  <h1 class="text-xl font-semibold text-[var(--color-foreground)]">PostFinance</h1>

  <button
    type="button"
    (click)="toggleTheme()"
    class="rounded-full border border-[var(--color-border)] px-4 py-2 text-sm font-medium text-[var(--color-foreground)] transition-colors hover:bg-[var(--color-surface)]"
    [attr.aria-pressed]="isDark()"
  >
    {{ isDark() ? '☀️' : '🌙' }}
  </button>
</header>

<main class="px-6 py-8">
  <router-outlet />
</main>
